name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the comment) so a moved tag can't change CI.
jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Versions pinned so the audit tools themselves can't change under us.
      - run: pip install pip-audit==2.10.1 zizmor==1.32.0 checkov==3.4.3
      # Known CVEs in any locked dependency fail the build.
      - run: pip-audit -r requirements.lock -r dashboard/requirements.txt --progress-spinner off
      # Workflow misconfigurations: injection, unpinned actions, excess permissions.
      - run: zizmor --offline .github/workflows/
      # Terraform misconfigurations; accepted trade-offs are listed with reasons in .checkov.yaml.
      - run: checkov -d infra --config-file .checkov.yaml

  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock -r dashboard/requirements.txt
      # Tests never call the live APIs; they use httpx.MockTransport.
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      # Parsing catches broken refs and Jinja in every model without needing data.
      - run: cd transform && dbt parse --profiles-dir .
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      # Needs no AWS credentials: the tests use a mocked provider.
      - run: make tf-check
